name: CI

on:
  pull_request:
  push:
    branches: [main, foundation/bootstrap]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}

  database-tests:
    name: Disposable local Supabase database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase stack
        run: supabase start --exclude rest,studio,mail,analytics,functions,storage,realtime,pooler
      - name: Apply every migration to the disposable database
        run: supabase db reset --local
      - name: Run database regression tests (pgTAP)
        run: supabase test db
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
